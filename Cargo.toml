[package]
name = "easy-sound-cues"
version = "1.1.0"
edition = "2024"
rust-version = "1.92"
description = "Plays the sound effects and music for a play, one button press at a time. Made for people who don't like computers."
license = "MIT"
repository = "https://github.com/ESP32-S3/easy-sound-cues"
readme = "README.md"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3", "mp4", "wav", "flac", "vorbis"] }
ebur128 = "0.1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
rfd = "0.18"
ureq = { version = "3.5", features = ["platform-verifier"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
os_info = { version = "3.15", default-features = false }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Keep function names (not the bulky debug info) so crash reports show where a crash happened.
strip = "debuginfo"

name: Build

# Every push is built and tested on Windows, Mac and Linux. Pushing a tag like v1.2.0 also
# publishes a release with the files people download (and that the app's updater fetches).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Mac
            os: macos-latest
          # The oldest Ubuntu runner, so the program also runs on older Linux systems.
          - name: Linux
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'Mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      # cpal needs ALSA's headers to build on Linux; the other systems need nothing extra.
      - name: Install the sound library headers
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Test
        run: cargo test --locked

      - name: Build for Windows
        if: matrix.name == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked
          mkdir dist
          cp target/release/easy-sound-cues.exe dist/Easy-Sound-Cues-Windows.exe

      # One app that runs on both Apple Silicon and Intel Macs.
      - name: Build for Mac
        if: matrix.name == 'Mac'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cargo build --release --locked --target aarch64-apple-darwin
          # Intel Macs as old as macOS 10.13 (Apple Silicon ones all run macOS 11 or newer).
          MACOSX_DEPLOYMENT_TARGET=10.13 cargo build --release --locked --target x86_64-apple-darwin
          app="Easy Sound Cues.app"
          mkdir -p dist "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/easy-sound-cues" \
            target/aarch64-apple-darwin/release/easy-sound-cues \
            target/x86_64-apple-darwin/release/easy-sound-cues
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out icon.iconset/icon_${s}x${s}.png > /dev/null
            sips -z $((s * 2)) $((s * 2)) assets/icon.png --out icon.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/icon.icns"
          # Without a paid Apple certificate the app can only be signed "ad hoc", which Apple
          # Silicon Macs still require before they'll run it at all.
          codesign --force --deep --sign - "$app"
          cp "$app/Contents/MacOS/easy-sound-cues" dist/easy-sound-cues-mac
          mkdir dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          # hdiutil sometimes finds the disk "busy" on CI machines, so give it a few tries.
          for try in 1 2 3 4 5; do
            hdiutil create -volname "Easy Sound Cues" -srcfolder dmg -ov -format UDZO dist/Easy-Sound-Cues-Mac.dmg && break
            sleep 5
          done
          test -f dist/Easy-Sound-Cues-Mac.dmg

      - name: Build for Linux
        if: matrix.name == 'Linux'
        run: |
          cargo build --release --locked
          mkdir -p dist "package/Easy Sound Cues"
          cp target/release/easy-sound-cues dist/easy-sound-cues-linux-x64
          cp target/release/easy-sound-cues assets/icon.svg packaging/linux/install.sh \
            packaging/linux/easy-sound-cues.desktop "package/Easy Sound Cues/"
          tar -C package -czf dist/Easy-Sound-Cues-Linux.tar.gz "Easy Sound Cues"

      - uses: actions/upload-artifact@v7
        with:
          name: Easy-Sound-Cues-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The updater checks that a download reports the version its release is named after.
      - name: Check the tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Easy Sound Cues ${GITHUB_REF_NAME#v}" \
              --notes-file packaging/release-notes.md
          fi
